<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Cart | Suitcase E-Shop</title>
    <link rel="stylesheet" href="../../dist/css/main.css" />
    <script type="module" src="../js/main.js" defer></script>
    <script type="module" src="../js/cart.js" defer></script>

</head>

<body class="cart-page">

<header id="header-root"></header>

<main class="main-content cart-page">
      <section id="hero-container"></section>

      <section class="cart-section" aria-label="Shopping Cart">
        <div class="container">
          <div class="cart-empty" id="cartEmptyState" hidden>
            <p class="cart-empty__text">Your cart is empty. Use the catalog to add new items.</p>
            <a class="btn btn--primary" href="./catalog.html">Continue Shopping</a>
          </div>

          <div class="cart-content" id="cartContent">
            <div class="cart-table-wrapper">
              <table class="cart-table">
                <thead class="cart-table__head">
                  <tr class="cart-table__row">
                    <th class="cart-table__th" scope="col">IMAGE</th>
                    <th class="cart-table__th" scope="col">PRODUCT NAME</th>
                    <th class="cart-table__th" scope="col">PRICE</th>
                    <th class="cart-table__th" scope="col">QUANTITY</th>
                    <th class="cart-table__th" scope="col">TOTAL</th>
                    <th class="cart-table__th" scope="col">DELETE</th>
                  </tr>
                </thead>
                <tbody class="cart-table__body" id="cartTableBody">
                  <tr class="cart-table__row" data-product-id="">
                    <td class="cart-table__td cart-table__td--image" data-label="IMAGE">
                      <img
                        class="cart-table__image"
                        src=""
                        alt=""
                        loading="lazy"
                      />
                    </td>
                    <td class="cart-table__td cart-table__td--name" data-label="PRODUCT NAME">
                      Nomad Haven
                    </td>
                    <td class="cart-table__td cart-table__td--price" data-label="PRICE">
                      $250
                    </td>
                    <td class="cart-table__td cart-table__td--quantity" data-label="QUANTITY">
                      <div class="cart-qty">
                        <button
                          class="cart-qty__btn"
                          type="button"
                          data-action="decrease"
                          aria-label="Decrease quantity"
                        >
                          -
                        </button>
                        <span class="cart-qty__value">1</span>
                        <button
                          class="cart-qty__btn"
                          type="button"
                          data-action="increase"
                          aria-label="Increase quantity"
                        >
                          +
                        </button>
                      </div>
                    </td>
                    <td class="cart-table__td cart-table__td--total" data-label="TOTAL">
                      $250
                    </td>
                    <td class="cart-table__td cart-table__td--delete" data-label="DELETE">
                      <button
                        class="cart-table__delete-btn"
                        type="button"
                        data-action="remove"
                        aria-label="Remove Nomad Haven from cart"
                      >
                        <svg
                          class="cart-table__delete-icon"
                          width="18"
                          height="18"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <polyline points="3 6 5 6 21 6"></polyline>
                          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                          <path d="M10 11v6"></path>
                          <path d="M14 11v6"></path>
                          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                        </svg>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="cart-bottom">
              <div class="cart-actions">
                <a class="btn btn--primary cart-actions__btn" href="./catalog.html">
                  CONTINUE SHOPPING
                </a>
                <button
                  class="btn btn--primary cart-actions__btn"
                  type="button"
                  id="clearCartBtn"
                >
                  CLEAR SHOPPING CART
                </button>
              </div>

              <aside class="cart-summary" aria-label="Order Summary">
                <div class="cart-summary__row">
                  <span class="cart-summary__label">Sub Total</span>
                  <span class="cart-summary__value" id="cartSubTotal">$0</span>
                </div>
                <div class="cart-summary__row">
                  <span class="cart-summary__label">Shipping</span>
                  <span class="cart-summary__value" id="cartShipping">$30</span>
                </div>
                <div class="cart-summary__row cart-summary__row--total">
                  <span class="cart-summary__label">Total</span>
                  <span class="cart-summary__value" id="cartTotal">$0</span>
                </div>
                <button
                  class="btn btn--primary cart-summary__checkout-btn"
                  type="button"
                  id="checkoutBtn"
                >
                  CHECKOUT
                </button>
              </aside>
            </div>
          </div>

          <output class="cart-feedback" id="cartFeedback" aria-live="polite" hidden></output>
        </div>
      </section>
    </main>

<footer id="footer-root"></footer>
</body>
</html>
