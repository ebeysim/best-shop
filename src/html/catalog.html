<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Catalog | Suitcase E-Shop</title>
    <link rel="stylesheet" href="../../dist/css/main.css" />
    <script type="module" src="../js/main.js" defer></script>
    <script type="module" src="../js/catalog.js"></script>
</head>
<body class="catalog-page">
<header id="header-root"></header>

<main class="main-content catalog-page">
    <div class="container">
        <!-- Filter Bar (Hover Dropdowns + Reset) -->
        <section class="catalog-filters" aria-label="Product Filters">
            <!-- Toggle button shown when panel is closed -->
            <div class="catalog-filters__top-bar">
                <button
                        type="button"
                        class="btn btn--primary catalog-filters__toggle-btn"
                        id="open-filters-btn"
                        aria-expanded="false"
                        aria-controls="catalog-filters-panel"
                >
                    FILTERS
                </button>
            </div>

            <!-- Collapsible Filter Panel (Hidden by default on all viewports) -->
            <div class="catalog-filters__panel" id="catalog-filters-panel" hidden>
                <div class="catalog-filters__grid">
                    <!-- Size Dropdown -->
                    <div class="filter-field">
                        <span class="filter-field__label">Size</span>
                        <div class="filter-dropdown" data-filter="size">
                            <button type="button" class="filter-dropdown__trigger" data-default-label="Choose option">
                                <span class="filter-dropdown__value">Choose option</span>
                                <span class="filter-dropdown__arrow" aria-hidden="true">⌄</span>
                            </button>
                            <ul class="filter-dropdown__menu">
                                <li><button type="button" data-value="S">S</button></li>
                                <li><button type="button" data-value="M">M</button></li>
                                <li><button type="button" data-value="L">L</button></li>
                                <li><button type="button" data-value="XL">XL</button></li>
                                <li><button type="button" data-value="S-L">S-L</button></li>
                                <li><button type="button" data-value="S, M, XL">S, M, XL</button></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Color Dropdown -->
                    <div class="filter-field">
                        <span class="filter-field__label">Color</span>
                        <div class="filter-dropdown" data-filter="color">
                            <button type="button" class="filter-dropdown__trigger" data-default-label="Choose option">
                                <span class="filter-dropdown__value">Choose option</span>
                                <span class="filter-dropdown__arrow" aria-hidden="true">⌄</span>
                            </button>
                            <ul class="filter-dropdown__menu">
                                <li><button type="button" data-value="red">Red</button></li>
                                <li><button type="button" data-value="blue">Blue</button></li>
                                <li><button type="button" data-value="green">Green</button></li>
                                <li><button type="button" data-value="black">Black</button></li>
                                <li><button type="button" data-value="grey">Grey</button></li>
                                <li><button type="button" data-value="yellow">Yellow</button></li>
                                <li><button type="button" data-value="pink">Pink</button></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Category Dropdown -->
                    <div class="filter-field">
                        <span class="filter-field__label">Category</span>
                        <div class="filter-dropdown" data-filter="category">
                            <button type="button" class="filter-dropdown__trigger" data-default-label="Choose option">
                                <span class="filter-dropdown__value">Choose option</span>
                                <span class="filter-dropdown__arrow" aria-hidden="true">⌄</span>
                            </button>
                            <ul class="filter-dropdown__menu">
                                <li><button type="button" data-value="carry-ons">Carry-ons</button></li>
                                <li><button type="button" data-value="suitcases">Suitcases</button></li>
                                <li><button type="button" data-value="luggage sets">Luggage Sets</button></li>
                                <li><button type="button" data-value="kids' luggage">Kids' Luggage</button></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Sales Checkbox -->
                    <div class="filter-field filter-field--checkbox">
                        <label class="filter-field__label" for="filter-sales-checkbox">Sales</label>
                        <input
                                type="checkbox"
                                class="filter-field__checkbox"
                                id="filter-sales-checkbox"
                        />
                    </div>
                </div>

                <div class="catalog-filters__actions">
                    <button type="button" class="btn btn--primary" id="clear-filters-btn">
                        CLEAR FILTERS
                    </button>
                    <button type="button" class="btn btn--primary" id="hide-filters-btn">
                        HIDE FILTERS
                    </button>
                </div>
            </div>
        </section>

        <!-- 2-Column Catalog Layout (Products Left, Search + Top Best Sets Right) -->
        <div class="catalog-layout">
            <!-- Main Column -->
            <section class="catalog-main">
                <div class="catalog-toolbar">
                    <p class="catalog-toolbar__count" id="results-count">Showing 0–0 of 0 Results</p>



                    <select class="catalog-toolbar__sort" id="catalog-sort" aria-label="Sort products">
                        <option value="default">Default Sorting</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="popularity">Popularity</option>
                        <option value="rating">Rating: Highest First</option>
                    </select>
                </div>

                <!-- 3-Column Desktop Product Grid (12 per page) -->
                <div class="catalog-grid" id="catalog-grid"></div>

                <!-- Async Pagination -->
                <nav class="catalog-pagination" id="catalog-pagination" aria-label="Catalog Pagination"></nav>
            </section>

            <!-- Right Sidebar -->
            <aside class="catalog-sidebar">
                <form class="catalog-search" id="catalog-search-form" role="search">
                    <input
                            type="search"
                            class="catalog-search__input"
                            id="catalog-search-input"
                            placeholder="Search Models"
                            aria-label="Search Models"
                    />
                    <button type="submit" class="catalog-search__btn" aria-label="Search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>

                <section class="top-best-sets">
                    <h2 class="top-best-sets__title">Top Best Sets</h2>
                    <div class="top-best-sets__list" id="top-best-sets-list"></div>
                </section>
            </aside>
        </div>
    </div>
</main>

<!-- "Product not found" Modal Pop-up -->
<dialog class="search-modal" id="not-found-modal">
    <div class="search-modal__content">
        <h3 class="search-modal__title">Product Not Found</h3>
        <p class="search-modal__text">No models matched your search. Try another model name.</p>
        <button type="button" class="btn btn--primary" id="close-not-found-btn">Close</button>
    </div>
</dialog>

<footer  id="footer-root"></footer>
</body>
</html>
