<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Contact Us | Suitcase E-Shop</title>
    <link rel="stylesheet" href="../../dist/css/main.css" />
    <script type="module" src="../js/main.js" defer></script>
    <script type="module" src="../js/contact.js" defer></script>
</head>
<body class="contact-page">
<header id="header-root"></header>

<main class="main-content">
    <!-- 1. Hero Banner -->
    <section id="hero-container"></section>

    <!-- 2. Contact Info Cards (Reuses FeatureMiniCard via .map) -->
    <section class="contact-info">
        <div class="contact-info__cards-container" id="contact-info-container"></div>
    </section>

    <!-- 3. Feedback Image & Global Form -->
    <section class="contact-feedback">
        <div class="contact-feedback__image">
            <img src="../assets/images/contact/feedback image.jpg" alt="Packed suitcase with shoes, hat, and camera">
        </div>

        <div class="contact-feedback__form-wrapper">
            <h2 class="contact-feedback__title">Your Feedback Is Much Appreciated!</h2>
            <p class="contact-feedback__subtitle">We will contact you when you complete the following form!</p>

            <form class="form" id="contact-form" novalidate>
                <div class="form__group">
                    <label class="form__label" for="contact-name">
                        Your Name <span class="form__required">*</span>
                    </label>
                    <input class="form__input" type="text" id="contact-name" name="name" required>
                </div>

                <div class="form__group">
                    <label class="form__label" for="contact-email">
                        Your Email Address <span class="form__required">*</span>
                    </label>
                    <input class="form__input" type="email" id="contact-email" name="email" required>
                    <span class="form__error" id="contact-email-error" aria-live="polite"></span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="contact-topic">
                        Topic <span class="form__required">*</span>
                    </label>
                    <input class="form__input" type="text" id="contact-topic" name="topic" required>
                </div>

                <div class="form__group">
                    <label class="form__label" for="contact-message">
                        Your Message <span class="form__required">*</span>
                    </label>
                    <textarea class="form__textarea" id="contact-message" name="message" rows="5" required></textarea>
                </div>

                <button class="btn form__submit" type="submit">SEND</button>
            </form>
        </div>
    </section>
</main>

<footer id="footer-root"></footer>
</body>
</html>
